# ==============================================================================
# Nginx Reverse Proxy Configuration for Web-GIS Next.js Application
# Lokasi di VPS: /etc/nginx/sites-available/yourdomain.com
# ==============================================================================

server {
    listen 8080;
    listen [::]:8080;
    
    # Ganti dengan nama domain atau subdomain Anda
    server_name yourdomain.com www.yourdomain.com;

    # Batas maksimal ukuran unggahan berkas (krusial untuk foto 360° resolusi tinggi)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Security Headers Tambahan di Level Nginx
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lokasi Proxy ke Next.js Application Container (127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Dukungan WebSocket & SSE (Server-Sent Events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forwarding Client Identity Headers (OWASP Security)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout saat mengunggah foto berukuran besar
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Cache untuk aset statis Next.js agar loading super cepat
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Akses langsung berkas foto unggahan
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
