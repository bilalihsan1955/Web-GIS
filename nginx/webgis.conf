# ==============================================================================
# Nginx Reverse Proxy Configuration for Web-GIS Next.js Application
# Terintegrasi dengan stream-mux (port 80) via PROXY protocol & HTTPS port 443
# ==============================================================================

# ---------------- 1. HTTP internal (dari stream-mux port 80) ----------------
server {
    listen 127.0.0.1:8080 proxy_protocol;
    server_name view360.space www.view360.space;

    # Real IP diteruskan dari stream-mux lewat PROXY protocol
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_tokens off;

    # Verifikasi Let's Encrypt Certbot Auto-Renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect seluruh trafik HTTP biasa ke HTTPS aman
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- 2. HTTPS publik (Port 443) ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name view360.space www.view360.space;

    # Sertifikat SSL dari Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/view360.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view360.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL_WEBGIS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Security Headers Tambahan di Level Nginx
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ACME Challenge untuk Auto-Renewal Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Lokasi Proxy ke Next.js Application Container (127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Dukungan WebSocket & SSE (Server-Sent Events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forwarding Client Identity Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeout saat mengunggah foto berukuran besar
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    # Cache untuk aset statis Next.js agar loading super cepat
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Akses langsung berkas foto unggahan
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
