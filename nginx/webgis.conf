# ==============================================================================
# Nginx Reverse Proxy Configuration for Web-GIS Next.js Application
# Terintegrasi dengan stream-mux (port 80) via PROXY protocol
# ==============================================================================

# ---------------- HTTP internal (dari stream multiplexer port 80) ----------------
server {
    listen 127.0.0.1:8080 proxy_protocol;
    server_name view360.space www.view360.space;

    # Real IP diteruskan dari stream-mux lewat PROXY protocol
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_tokens off;
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Verifikasi Let's Encrypt Certbot Webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security Headers Tambahan di Level Nginx
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lokasi Proxy ke Next.js Application Container (127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Dukungan WebSocket & SSE (Server-Sent Events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forwarding Client Identity Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout saat mengunggah foto berukuran besar
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Cache untuk aset statis Next.js agar loading super cepat
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # Akses langsung berkas foto unggahan
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
